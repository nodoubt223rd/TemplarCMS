version: 2.1

jobs:
  build-and-test:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:10.0
    working_directory: ~/project
    environment:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_HOME: /root/project/.tmp/dotnet-cli
      NUGET_PACKAGES: /root/project/.tmp/nuget-packages
      APPDATA: /root/project/.tmp/appdata
    steps:
      - checkout

      - restore_cache:
          keys:
            - templarcms-nuget-v1-{{ checksum "global.json" }}-{{ checksum "Directory.Build.props" }}-{{ checksum "nuget.config" }}
            - templarcms-nuget-v1-

      - run:
          name: Prepare local Dotnet and NuGet directories
          command: |
            mkdir -p "$DOTNET_CLI_HOME"
            mkdir -p "$NUGET_PACKAGES"
            mkdir -p "$APPDATA/NuGet"
            cp nuget.config "$APPDATA/NuGet/NuGet.Config"

      - run:
          name: Restore test projects
          command: |
            while IFS= read -r project; do
              dotnet restore "$project" --configfile nuget.config
            done < <(find tests -name '*.csproj' | sort)

      - save_cache:
          key: templarcms-nuget-v1-{{ checksum "global.json" }}-{{ checksum "Directory.Build.props" }}-{{ checksum "nuget.config" }}
          paths:
            - /root/project/.tmp/nuget-packages

      - run:
          name: Run test projects
          command: |
            while IFS= read -r project; do
              dotnet test "$project" --no-restore --configuration Release --logger "console;verbosity=minimal"
            done < <(find tests -name '*.csproj' | sort)

workflows:
  build:
    jobs:
      - build-and-test
